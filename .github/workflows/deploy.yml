name: Deploy para GitHub Pages

# CI/CD: toda vez que main é atualizada, builda e publica automaticamente
on:
  push:
    branches: [main]
  workflow_dispatch: # permite disparar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Evita builds concorrentes disputando o mesmo deploy
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instala dependências
        run: npm ci

      - name: Gera build de produção (minifica CSS/JS)
        run: npm run build

      - name: Adapta caminhos para publicação na raiz do Pages
        run: |
          cp dist/html/index.html dist/index.html
          sed -i 's|\.\./css/|css/|g; s|\.\./js/|js/|g; s|\.\./img/|img/|g' dist/index.html

      - name: Prepara artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
